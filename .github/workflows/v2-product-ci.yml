name: V2 Product Skeleton CI

on:
  push:
    branches: [v2-product-skeleton]
  pull_request:
    branches: [main]

jobs:
  test-v2-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and V2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-v2.txt
      - name: Run V2 engine tests
        run: python -m pytest tests/test_v2_engine.py -q
      - name: Compile V2 Python modules
        run: python -m py_compile src/vaanirakshak/v2_engine.py src/vaanirakshak/v2_server.py
